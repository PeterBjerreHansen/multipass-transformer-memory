name: fbt
status: planned
question: Which FBT fusion recipe and backbone learning rate adapt latent feedback without degrading one-pass behavior?
arms:
  - {id: current_phase_b_lr3e7, config: current_phase_b_lr3e7.yaml}
  - {id: paper_phase_b_lr1e7, config: paper_phase_b_lr1e7.yaml}
  - {id: paper_phase_b_lr3e7, config: paper_phase_b_lr3e7.yaml}
  - {id: paper_phase_b_lr1e6, config: paper_phase_b_lr1e6.yaml}
  - {id: paper_phase_a_control, config: paper_phase_a_control.yaml}
  - {id: paper_phase_b_heavy_lr3e7, config: paper_phase_b_heavy_lr3e7.yaml}
comparisons:
  - name: fusion_recipe
    arms: [current_phase_b_lr3e7, paper_phase_b_lr3e7]
    experimental_axes: [fbt_normalize_gate_input, fbt_latent_jitter_std]
    allowed_differences: []
  - name: phase_b_backbone_lr
    arms: [paper_phase_b_lr1e7, paper_phase_b_lr3e7, paper_phase_b_lr1e6]
    experimental_axes: [pretrained_learning_rate]
    allowed_differences: []
  - name: feedback_mass
    arms: [paper_phase_b_lr3e7, paper_phase_b_heavy_lr3e7]
    experimental_axes: [pass_schedule]
    allowed_differences: []
  - name: frozen_control
    arms: [paper_phase_b_lr3e7, paper_phase_a_control]
    experimental_axes: [phase, pretrained_learning_rate, pass_schedule, ntp_pass_loss_weights_by_k]
    allowed_differences: []
