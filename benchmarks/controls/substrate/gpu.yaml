variant: swa_transformer
phase: B
model_dir: checkpoints/TinyMistral-248M-v3
data_dir: data/dolmino/gpu_2048
output_dir: benchmarks/controls/substrate/results/gpu
device: cuda
dtype: float32
autocast_dtype: bfloat16
attention_backend: auto
seed: 1337
architecture_seed: 4242
# Preserve the 2,048-token development optimizer batch until CUDA qualification.
batch_size: 1
grad_accum_steps: 1
max_unique_tokens: 100007936
learning_rate: 1.0e-6
min_lr_ratio: 0.1
warmup_tokens: 1000000
lr_schedule:
  type: cosine
  warmup_tokens: 1000000
  min_multiplier: 0.1
weight_decay: 0.01
grad_clip: 1.0
pass_schedule:
  - probabilities:
      1: 1.0
ntp_pass_loss_weights: null
eval_every_tokens: 5000000
eval_passes: 1
eval_batches: 128
# Spot-safe recovery: whichever cadence fires first writes a durable generation.
checkpoint_every_tokens: 500000
checkpoint_every_seconds: 600
checkpoint_keep_last: 2
snapshot_at_tokens:
  - 25000000
  - 50000000
  - 75000000
  - 100007936
resume_from: null
init_from: null
