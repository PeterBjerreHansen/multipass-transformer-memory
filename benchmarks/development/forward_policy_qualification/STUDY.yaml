name: forward_policy_qualification
status: planned
question: >-
  Does adaptive recirculation trained through a window-128 token-diagonal TBPTT
  forward improve recurrent validation NLL relative to its initialized fixed
  mixture and the existing whole-block parallel multipass training policy?
arms:
  - {id: recirculation_tbptt_w128_100_steps, config: recirculation_tbptt_w128_100_steps.yaml}
  - {id: recirculation_multipass_100_steps, config: recirculation_multipass_100_steps.yaml}
comparisons:
  - name: token_diagonal_vs_whole_block_training
    arms: [recirculation_tbptt_w128_100_steps, recirculation_multipass_100_steps]
    experimental_axes:
      - training_forward
      - recirculation_activation_checkpointing
      - recirculation_bptt_truncate_tokens
      - pass_schedule
      - ntp_pass_loss_weights
    allowed_differences:
      - attention_backend
      - validation_forward
      - eval_passes
