name: frozen_backbone_comparison
status: planned
question: >-
  From one common frozen TinyMistral checkpoint and equal optimizer/data dose,
  how long do the added feedback mechanisms reduce held-out NLL, and what are
  their accelerator-time and estimated-compute costs?
arms:
  - {id: recirculation_tbptt_w128_20m, config: recirculation_tbptt_w128_20m.yaml}
  - {id: recirculation_multipass_20m, config: recirculation_multipass_20m.yaml}
  - {id: dense_memory_attention_multipass_20m, config: dense_memory_attention_multipass_20m.yaml}
  - {id: strided_memory_attention_multipass_20m, config: strided_memory_attention_multipass_20m.yaml}
  - {id: multiscale_memory_attention_multipass_20m, config: multiscale_memory_attention_multipass_20m.yaml}
comparisons:
  - name: recirculation_training_policy
    arms: [recirculation_tbptt_w128_20m, recirculation_multipass_20m]
    experimental_axes:
      - training_forward
      - recirculation_activation_checkpointing
      - recirculation_bptt_truncate_tokens
      - pass_schedule
      - ntp_pass_loss_weights_by_k
    allowed_differences:
      - attention_backend
      - validation_forward
      - eval_passes
  - name: frozen_feedback_mechanisms
    arms:
      - recirculation_tbptt_w128_20m
      - recirculation_multipass_20m
      - dense_memory_attention_multipass_20m
      - strided_memory_attention_multipass_20m
      - multiscale_memory_attention_multipass_20m
    experimental_axes:
      - variant
      - training_forward
      - recirculation_activation_checkpointing
      - recirculation_bptt_truncate_tokens
      - memory_window
      - memory_write_mode
      - memory_write_stride
      - memory_layers
      - memory_position_encoding
      - memory_dense_window
      - memory_sparse_window
      - memory_sparse_stride
      - recirculation_source_layer
      - recirculation_destination_layer
      - recirculation_mode
      - pass_schedule
      - ntp_pass_loss_weights_by_k
    allowed_differences:
      - added_learning_rate
      - attention_backend
      - validation_forward
      - eval_passes
