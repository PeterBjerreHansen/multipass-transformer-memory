name: frozen_backbone_comparison
status: planned
question: >-
  From one common frozen TinyMistral checkpoint and equal optimizer/data dose,
  how long do the added feedback mechanisms reduce held-out NLL, and what are
  their accelerator-time and estimated-compute costs?
arms:
  - {id: recirculation_bptt_20m, config: recirculation_bptt_20m.yaml}
  - {id: recirculation_multipass_20m, config: recirculation_multipass_20m.yaml}
  - {id: dense_memory_attention_multipass_20m, config: dense_memory_attention_multipass_20m.yaml}
comparisons:
  - name: recirculation_training_policy
    arms: [recirculation_bptt_20m, recirculation_multipass_20m]
    experimental_axes:
      - training_forward
      - recirculation_activation_checkpointing
      - pass_schedule
      - ntp_pass_loss_weights
    allowed_differences:
      - validation_forward
      - eval_passes
  - name: frozen_feedback_mechanisms
    arms:
      - recirculation_bptt_20m
      - recirculation_multipass_20m
      - dense_memory_attention_multipass_20m
    experimental_axes:
      - variant
      - training_forward
      - recirculation_activation_checkpointing
      - memory_write_mode
      - memory_layers
      - memory_position_encoding
      - recirculation_source_layer
      - recirculation_destination_layer
      - recirculation_mode
      - pass_schedule
      - ntp_pass_loss_weights
    allowed_differences:
      - added_learning_rate
      - validation_forward
      - eval_passes
