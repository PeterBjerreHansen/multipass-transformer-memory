name: frozen_backbone_comparison
status: planned
learning_rates_qualified: false
question: >-
  With a frozen TinyMistral backbone, matched sites, approximately matched
  added parameters, one token order, and one training dose, how does feedback
  access architecture affect held-out NLL and live-feedback fidelity?
data_artifacts:
  data/dolmino/gpu_2048: f631956c92f94bdd61e4c073359e9e0e7c20e8ddc5bb3cd1a378954e93fa2fcb
arms:
  # Primary one-site dense group: [3].
  - {id: no_memory_adapter_one_site_100m, config: no_memory_adapter_one_site_100m.yaml}
  - {id: recurrent_projected_residual_multipass_100m, config: recurrent_projected_residual_multipass_100m.yaml}
  - {id: recurrent_recirculation_multipass_100m, config: recurrent_recirculation_multipass_100m.yaml}
  - {id: dense_memory_attention_one_site_100m, config: dense_memory_attention_one_site_100m.yaml}
  # Primary two-site dense group: [3, 7].
  - {id: no_memory_adapter_two_site_100m, config: no_memory_adapter_two_site_100m.yaml}
  - {id: recurrent_projected_residual_two_site_100m, config: recurrent_projected_residual_two_site_100m.yaml}
  - {id: recurrent_recirculation_two_site_100m, config: recurrent_recirculation_two_site_100m.yaml}
  - {id: dense_memory_attention_multipass_100m, config: dense_memory_attention_multipass_100m.yaml}
  # Attention extensions, executed only after the primary dense groups pass preflight.
  - {id: strided_memory_attention_one_site_100m, config: strided_memory_attention_one_site_100m.yaml}
  - {id: dense_and_strided_memory_attention_one_site_100m, config: dense_and_strided_memory_attention_one_site_100m.yaml}
  - {id: strided_memory_attention_multipass_100m, config: strided_memory_attention_multipass_100m.yaml}
  - {id: dense_and_strided_memory_attention_multipass_100m, config: dense_and_strided_memory_attention_multipass_100m.yaml}
  # Predeclared two-site physical-stride ablation; C=32 is the extension arm above.
  - {id: strided_memory_attention_stride8_two_site_100m, config: strided_memory_attention_stride8_two_site_100m.yaml}
  - {id: strided_memory_attention_stride16_two_site_100m, config: strided_memory_attention_stride16_two_site_100m.yaml}
  - {id: strided_memory_attention_stride64_two_site_100m, config: strided_memory_attention_stride64_two_site_100m.yaml}
comparisons:
  - name: one_site_dense_wiring
    arms:
      - no_memory_adapter_one_site_100m
      - recurrent_projected_residual_multipass_100m
      - recurrent_recirculation_multipass_100m
      - dense_memory_attention_one_site_100m
    experimental_axes:
      - variant
      - memory_window
      - memory_pattern
      - memory_write_mode
      - memory_position_encoding
      - memory_num_key_value_heads
      - recurrent_merger
      - recurrent_controller_hidden_size
    allowed_differences: []
  - name: two_site_dense_wiring
    arms:
      - no_memory_adapter_two_site_100m
      - recurrent_projected_residual_two_site_100m
      - recurrent_recirculation_two_site_100m
      - dense_memory_attention_multipass_100m
    experimental_axes:
      - variant
      - memory_window
      - memory_pattern
      - memory_write_mode
      - memory_position_encoding
      - memory_num_key_value_heads
      - recurrent_merger
      - recurrent_controller_hidden_size
    allowed_differences: []
  - name: one_site_attention_layouts
    arms:
      - dense_memory_attention_one_site_100m
      - strided_memory_attention_one_site_100m
      - dense_and_strided_memory_attention_one_site_100m
    experimental_axes:
      - variant
      - memory_window
      - memory_pattern
      - memory_write_mode
      - memory_write_stride
      - memory_dense_window
      - memory_sparse_window
      - memory_sparse_stride
    allowed_differences: [batch_size, grad_accum_steps]
  - name: two_site_attention_layouts
    arms:
      - dense_memory_attention_multipass_100m
      - strided_memory_attention_multipass_100m
      - dense_and_strided_memory_attention_multipass_100m
    experimental_axes:
      - variant
      - memory_window
      - memory_pattern
      - memory_write_mode
      - memory_write_stride
      - memory_dense_window
      - memory_sparse_window
      - memory_sparse_stride
    allowed_differences: [batch_size, grad_accum_steps]
  - name: two_site_physical_stride_length
    arms:
      - strided_memory_attention_stride8_two_site_100m
      - strided_memory_attention_stride16_two_site_100m
      - strided_memory_attention_multipass_100m
      - strided_memory_attention_stride64_two_site_100m
    experimental_axes: [memory_write_stride]
    allowed_differences: []
