name: nmp_100m_continuation
status: planned
question: Does mixed-pass shared-final Memory-Attention NMP improve a 100M hybrid checkpoint beyond matched NTP continuation and a head-only placebo over 50 Mi new tokens?
arms:
  - {id: ntp_control, config: ntp_control.yaml}
  - {id: bank_nmp_coupled, config: bank_nmp_coupled.yaml}
  - {id: bank_nmp_head_only, config: bank_nmp_head_only.yaml}
comparisons:
  - name: primary_causal_triplet
    arms: [ntp_control, bank_nmp_coupled, bank_nmp_head_only]
    experimental_axes:
      - bank_nmp_weight
      - bank_nmp_pass_loss_weights_by_k
      - nmp_warmup_tokens
      - nmp_eval_passes
      - nmp_detach_predictor_input
      - nmp_predictor_learning_rate
    allowed_differences: []
