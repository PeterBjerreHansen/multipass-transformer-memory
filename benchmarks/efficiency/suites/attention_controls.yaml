name: attention_controls_2048_bf16
defaults:
  device: cuda
  model_dir: checkpoints/TinyMistral-248M-v3
  parameter_dtype: float32
  autocast_dtype: bfloat16
  attention_backend: auto
  warmup_steps: 2
  measure_steps: 5
  sequence_length: 2048
  batch_size: 1
  grad_accum_steps: 1
  memory_position_encoding: rope
cases:
- variant: vanilla
  passes: 1
- variant: sparse_swa
  passes: 1
  sparse_attention_stride: 32
  sparse_attention_window: 32
  sparse_attention_layers: [3, 7]
- variant: bank
  passes: 2
  memory_window: 32
  memory_layers: [3, 7]
  memory_write_mode: periodic
  memory_write_stride: 32
- variant: bank
  passes: 3
  memory_window: 32
  memory_layers: [3, 7]
  memory_write_mode: periodic
  memory_write_stride: 32
- variant: bank_multiscale
  passes: 2
  memory_dense_window: 32
  memory_sparse_window: 32
  memory_sparse_stride: 32
  memory_layers: [4, 7]
- variant: bank_multiscale
  passes: 3
  memory_dense_window: 32
  memory_sparse_window: 32
  memory_sparse_stride: 32
  memory_layers: [4, 7]
- variant: bank_recirculation_hybrid
  passes: 2
  memory_window: 32
  memory_layers: [4, 7]
  memory_write_mode: periodic
  memory_write_stride: 32
  recirculation_mode: adaptive
  recirculation_source_layer: 6
  recirculation_destination_layer: 3
  recirculation_alpha: 0.1
- variant: bank_recirculation_hybrid
  passes: 3
  memory_window: 32
  memory_layers: [4, 7]
  memory_write_mode: periodic
  memory_write_stride: 32
  recirculation_mode: adaptive
  recirculation_source_layer: 6
  recirculation_destination_layer: 3
  recirculation_alpha: 0.1
