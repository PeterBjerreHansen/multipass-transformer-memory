  model_dir: checkpoints/TinyMistral-248M-v3
  parameter_dtype: float32
  autocast_dtype: null
  attention_backend: auto
  warmup_steps: 1
  measure_steps: 3
  grad_accum_steps: 1
  sequence_length: 2048
