name: cuda_batch_qualification_k2_2048
defaults:
  device: cuda
  model_dir: checkpoints/TinyMistral-248M-v3
  parameter_dtype: float32
  autocast_dtype: bfloat16
  attention_backend: auto
  warmup_steps: 1
  measure_steps: 3
  sequence_length: 2048
  grad_accum_steps: 1
cases:
- variant: recirculation
  passes: 2
  batch_size: 1
  recirculation_mode: adaptive
  recirculation_source_layer: 6
  recirculation_destination_layer: 3
  recirculation_alpha: 0.1
- variant: recirculation
  passes: 2
  batch_size: 2
  recirculation_mode: adaptive
  recirculation_source_layer: 6
  recirculation_destination_layer: 3
  recirculation_alpha: 0.1
- variant: recirculation
  passes: 2
  batch_size: 4
  recirculation_mode: adaptive
  recirculation_source_layer: 6
  recirculation_destination_layer: 3
  recirculation_alpha: 0.1
- variant: recirculation
  passes: 2
  batch_size: 8
  recirculation_mode: adaptive
  recirculation_source_layer: 6
  recirculation_destination_layer: 3
  recirculation_alpha: 0.1
- variant: tape
  passes: 2
  batch_size: 1
  memory_write_mode: dense
- variant: tape
  passes: 2
  batch_size: 2
  memory_write_mode: dense
- variant: tape
  passes: 2
  batch_size: 4
  memory_write_mode: dense
- variant: tape
  passes: 2
  batch_size: 8
  memory_write_mode: dense
