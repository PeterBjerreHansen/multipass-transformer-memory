name: forward-mode qualification
purpose: >-
  Engineering-only comparison of ordinary parallel training, whole-block
  multipass recirculation, and token-diagonal recirculation BPTT. This suite
  selects feasible hardware microbatches; it does not rank model quality.

defaults:
  model_dir: checkpoints/TinyMistral-248M-v3
  device: cuda
  parameter_dtype: float32
  autocast_dtype: bfloat16
  attention_backend: auto
  batch_size: 1
  grad_accum_steps: 1
  warmup_steps: 1
  measure_steps: 2
  seed: 1337

cases:
  - name: vanilla_parallel_t1024
    variant: swa_transformer
    phase: B
    training_forward: parallel_multipass
    passes: 1
    sequence_length: 1024

  - name: recirculation_parallel_k2_t1024
    variant: recirculation
    phase: A
    training_forward: parallel_multipass
    passes: 2
    sequence_length: 1024
    recirculation_source_layer: 6
    recirculation_destination_layer: 3
    recirculation_alpha: 0.1
    recirculation_mode: adaptive

  - name: recirculation_tbptt_w128_t1024
    variant: recirculation
    phase: A
    training_forward: recirculation_bptt
    recirculation_activation_checkpointing: true
    passes: 1
    sequence_length: 1024
    recirculation_bptt_truncate_tokens: 128
    recirculation_source_layer: 6
    recirculation_destination_layer: 3
    recirculation_alpha: 0.1
    recirculation_mode: adaptive

  - name: recirculation_tbptt_w256_t1024
    variant: recirculation
    phase: A
    training_forward: recirculation_bptt
    recirculation_activation_checkpointing: true
    passes: 1
    sequence_length: 1024
    recirculation_bptt_truncate_tokens: 256
    recirculation_source_layer: 6
    recirculation_destination_layer: 3
    recirculation_alpha: 0.1
    recirculation_mode: adaptive

  - name: recirculation_tbptt_w512_t1024
    variant: recirculation
    phase: A
    training_forward: recirculation_bptt
    recirculation_activation_checkpointing: true
    passes: 1
    sequence_length: 1024
    recirculation_bptt_truncate_tokens: 512
    recirculation_source_layer: 6
    recirculation_destination_layer: 3
    recirculation_alpha: 0.1
    recirculation_mode: adaptive

  - name: recirculation_bptt_t1024
    variant: recirculation
    phase: A
    training_forward: recirculation_bptt
    recirculation_activation_checkpointing: true
    passes: 1
    sequence_length: 1024
    recirculation_source_layer: 6
    recirculation_destination_layer: 3
    recirculation_alpha: 0.1
    recirculation_mode: adaptive

  - name: dense_memory_attention_parallel_k2_t1024
    variant: memory_attention
    phase: A
    training_forward: parallel_multipass
    passes: 2
    sequence_length: 1024
    memory_window: 32
    memory_write_mode: dense
    memory_layers: [3, 7]
    memory_position_encoding: rope
