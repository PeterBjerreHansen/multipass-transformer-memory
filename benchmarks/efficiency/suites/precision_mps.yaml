name: mps_fp32_vs_bf16_2048
defaults:
  device: mps
  model_dir: checkpoints/TinyMistral-248M-v3
  parameter_dtype: float32
  attention_backend: auto
  warmup_steps: 1
  measure_steps: 3
  sequence_length: 2048
  batch_size: 1
  grad_accum_steps: 1
cases:
- variant: vanilla
  passes: 1
  autocast_dtype: null
- variant: vanilla
  passes: 1
  autocast_dtype: bfloat16
- variant: recirculation
  passes: 2
  autocast_dtype: null
  recirculation_mode: adaptive
  recirculation_source_layer: 6
  recirculation_destination_layer: 3
  recirculation_alpha: 0.1
- variant: recirculation
  passes: 2
  autocast_dtype: bfloat16
  recirculation_mode: adaptive
  recirculation_source_layer: 6
  recirculation_destination_layer: 3
  recirculation_alpha: 0.1
- variant: tape
  passes: 3
  autocast_dtype: null
  memory_write_mode: dense
- variant: tape
  passes: 3
  autocast_dtype: bfloat16
  memory_write_mode: dense
