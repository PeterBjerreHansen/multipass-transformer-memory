variant: fbt
phase: A
model_dir: checkpoints/TinyMistral-248M-v3
data_dir: data/dolmino/wiring_2048
output_dir: benchmarks/ad_hoc/fbt/results/paper_phase_a_control
device: mps
dtype: float32
autocast_dtype: null
attention_backend: auto
seed: 1337
architecture_seed: 4242
batch_size: 1
grad_accum_steps: 1
max_unique_tokens: 5242880
learning_rate: 1.0e-4
pretrained_learning_rate: 0.0
added_learning_rate: 1.0e-4
lr_schedule: {type: constant}
weight_decay: 0.01
grad_clip: 1.0
prefix_mixin_probability: 1.0
fbt_normalize_gate_input: true
fbt_latent_jitter_std: 0.02
# Phase A cannot learn on K=1 batches because FBT's added path starts at pass 2.
# Reweight the paper's feedback-bearing 22:3 subset while retaining K=3 exposure.
pass_schedule:
  - probabilities: {2: 0.88, 3: 0.12}
ntp_pass_loss_weights_by_k:
  2: [0.5, 0.5]
  3: [0.5, 0.25, 0.25]
eval_every_tokens: 262144
eval_passes: 4
eval_batches: 32
early_stop:
  pass_nll_max: {1: 2.573, 4: 2.34}
  pass_nll_delta_max:
    - {pass: 4, reference_pass: 2, max_delta: 0.02}
  hidden_delta_nonincreasing: true
checkpoint_every_tokens: 262144
checkpoint_every_seconds: 900.0
checkpoint_keep_last: 2
snapshot_at_tokens: [5242880]
resume_from: null
init_from: null
