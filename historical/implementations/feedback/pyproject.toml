[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-mistral-mptt"
version = "0.1.0"
description = "Research code for multi-pass training and feedback memory on TinyMistral."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6",
  "torch>=2.5",
  "safetensors>=0.4",
]

[project.optional-dependencies]
io = [
  "huggingface_hub>=0.25",
  "tokenizers>=0.20",
]
data = [
  "datasets>=4.0,<5",
  "huggingface_hub>=0.25",
  "tokenizers>=0.20",
  "zstandard>=0.22",
]
eval = [
  "lm-eval==0.4.12",
  "tokenizers>=0.20",
]
all = [
  "datasets>=4.0,<5",
  "huggingface_hub>=0.25",
  "lm-eval==0.4.12",
  "tokenizers>=0.20",
  "zstandard>=0.22",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "huggingface_hub>=0.25",
  "tokenizers>=0.20",
  "transformers==4.45.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires external model/data/evaluation dependencies",
]
